[project]
name = "frame-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
  "allennlp==2.10.1",  # last version of allennlp
  "concrete>=4.18.2",
  "flask>=3.0.3",
  "google-api-core<2.28.0",  # python version compatibility issue
  "google-auth<2.46.0",  # python version compatibility issue
  "gunicorn>=23.0.0",
  "overrides<5.0.0",  # python version compatibility issue
  "pandas>=2.0.3",
  "spacy>=3.3.3",
  "tokenizers>=0.13.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
